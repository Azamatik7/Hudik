<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир футбола</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- верхнее меню -->
    <div class="header">
        <div class="logo">Мир футбола</div>

        <ul class="menu">
            <li><a href="#">Главная</a></li>
            <li>
                <a href="#">Чемпионаты</a>
                <ul class="submenu">
                    <li><a href="#">АПЛ</a></li>
                    <li><a href="#">Ла Лига</a></li>
                    <li><a href="#">РПЛ</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Команды</a>
                <ul class="submenu">
                    <li><a href="#">Реал Мадрид</a></li>
                    <li><a href="#">Барселона</a></li>
                    <li><a href="#">Алания</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Игроки</a>
                <ul class="submenu">
                    <li><a href="#">Месси</a></li>
                    <li><a href="#">Роналду</a></li>
                    <li><a href="#">Неймар</a></li>
                </ul>
            </li>
            <li><a href="#">Контакты</a></li>
        </ul>
    </div>

    <!-- боковое меню -->
    <div class="sidebar">
        <a href="#">Новости</a>
        <a href="#">Матчи</a>
        <a href="#">Таблица</a>
        <a href="#">Трансферы</a>
        <a href="#">Видео</a>
    </div>

    <!-- карусель -->
    <div class="content">
        <div id="carousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="ronaldo.webp" class="d-block w-100" alt="Роналду">
                </div>
                <div class="carousel-item">
                    <img src="messi.webp" class="d-block w-100" alt="Месси">
                </div>
                <div class="carousel-item">
                    <img src="neymar.webp" class="d-block w-100" alt="Неймар">
                </div>
                <div class="carousel-item">
                    <img src="alania.webp" class="d-block w-100 emblem" alt="Алания">
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-target="#carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-target="#carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
